<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opus City</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1420'/%3E%3Crect x='6' y='12' width='6' height='14' fill='%234dd2ff'/%3E%3Crect x='13' y='6' width='6' height='20' fill='%23e8eef5'/%3E%3Crect x='20' y='15' width='6' height='11' fill='%234dd2ff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --panel: rgba(12, 16, 24, 0.78);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #e9edf3;
        --muted: #8b95a5;
        --accent: #4dd2ff;
        --good: #5fd38d;
        --warn: #f2c14e;
        --bad: #ff6b5e;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f16; }
      body { font-family: "Inter", system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
      #app { position: fixed; inset: 0; }

      .hud { position: absolute; inset: 0; pointer-events: none; }
      .panel {
        position: absolute; pointer-events: auto;
        background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }

      .clock { top: 16px; left: 16px; padding: 12px 16px 12px 14px; display: flex; gap: 12px; align-items: center; }
      .clock svg { width: 30px; height: 30px; flex: none; }
      .clock .time { font: 600 26px/1 "JetBrains Mono", monospace; letter-spacing: -0.5px; }
      .clock .date { font-size: 12px; color: var(--muted); margin-top: 4px; }

      .speed { top: 88px; left: 16px; padding: 4px; display: flex; gap: 2px; }
      .speed button {
        all: unset; cursor: pointer; font: 600 12px "Inter", sans-serif; color: var(--muted);
        padding: 6px 10px; border-radius: 8px; transition: background .15s, color .15s;
      }
      .speed button:hover { color: var(--text); background: rgba(255,255,255,0.06); }
      .speed button.active { color: #07131b; background: var(--accent); }

      .stats { top: 16px; right: 16px; padding: 12px 16px; min-width: 200px; }
      .stats .title { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
      .stats .row { display: flex; justify-content: space-between; gap: 24px; font-size: 13px; line-height: 1.75; }
      .stats .row span:last-child { font-family: "JetBrains Mono", monospace; }
      .stats .district { font-size: 15px; font-weight: 600; margin-bottom: 8px; }

      .minimap { left: 16px; bottom: 16px; padding: 8px; }
      .minimap canvas { display: block; border-radius: 6px; }

      .hints {
        left: 50%; transform: translateX(-50%); bottom: 16px; padding: 8px 14px;
        font-size: 12px; color: var(--muted); display: flex; gap: 14px; white-space: nowrap;
      }
      .hints kbd {
        font: 500 11px "JetBrains Mono", monospace; color: var(--text);
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 4px; padding: 1px 5px; margin-right: 4px;
      }

      .banner {
        top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px;
        font-size: 13px; display: none; align-items: center; gap: 10px;
      }
      .banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

      .inspector { right: 16px; top: 190px; width: 320px; max-height: calc(100vh - 230px); overflow-y: auto; padding: 16px; display: none; }
      .inspector::-webkit-scrollbar { width: 6px; }
      .inspector::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
      .inspector .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
      .inspector .name { font-size: 18px; font-weight: 700; }
      .inspector .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .inspector .chip {
        font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
        background: rgba(255,255,255,0.08);
      }
      .inspector .now {
        margin: 14px 0 12px; padding: 10px 12px; border-radius: 8px; background: rgba(77, 210, 255, 0.08);
        border: 1px solid rgba(77, 210, 255, 0.2); font-size: 13px; line-height: 1.5;
      }
      .inspector .now b { color: var(--accent); font-weight: 600; }
      .inspector .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 12.5px; }
      .inspector .kv div:nth-child(odd) { color: var(--muted); }
      .inspector h4 { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; font-weight: 600; }
      .need { display: grid; grid-template-columns: 62px 1fr 28px; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
      .need .bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
      .need .bar div { height: 100%; border-radius: 3px; }
      .need span:last-child { font-family: "JetBrains Mono", monospace; color: var(--muted); text-align: right; }
      .inspector .empty { font-size: 12px; color: var(--muted); font-style: italic; }
      .inspector .memory { font-size: 12px; line-height: 1.5; margin-bottom: 4px; }
      .inspector .actions { display: flex; gap: 8px; margin-top: 16px; }
      .inspector .actions button {
        all: unset; cursor: pointer; flex: 1; text-align: center; padding: 8px 0; border-radius: 8px;
        font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,0.08);
      }
      .inspector .actions button.primary { background: var(--accent); color: #07131b; }
      .inspector .actions button:hover { filter: brightness(1.1); }

      .stats .sep { height: 1px; background: var(--panel-border); margin: 6px 0; }
      .speed .chron-btn { margin-left: 6px; color: var(--text); background: rgba(255,255,255,0.06); }
      .hud.inspecting .stats { display: none; }
      .hud.inspecting .inspector { top: 16px; max-height: calc(100vh - 32px); }
      .inspector a { color: var(--accent); cursor: pointer; text-decoration: none; }
      .inspector a:hover { text-decoration: underline; }
      .inspector .rel { display: grid; grid-template-columns: 1fr auto 36px; gap: 8px; font-size: 12.5px; line-height: 1.7; }
      .inspector .rel span:last-child { text-align: right; font-family: "JetBrains Mono", monospace; }
      .inspector .rtype { color: var(--muted); font-size: 11.5px; }
      .inspector .memory .when, .toast .when { color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 11px; margin-right: 8px; }

      .feed { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
      .toast {
        background: var(--panel); border: 1px solid var(--panel-border); border-left: 3px solid var(--accent);
        border-radius: 8px; padding: 8px 12px; font-size: 12.5px; line-height: 1.45;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        animation: toast-in .25s ease-out; transition: opacity .8s, transform .8s;
      }
      .toast.major { border-left-color: var(--warn); }
      .toast.fade { opacity: 0; transform: translateY(-6px); }
      @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

      .chronicle {
        display: none; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(720px, calc(100vw - 32px)); max-height: 82vh; padding: 20px 22px; z-index: 5;
        overflow: hidden; flex-direction: column;
      }
      .chronicle .chron-head { display: flex; justify-content: space-between; align-items: flex-start; }
      .chronicle .chron-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
      .chronicle .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .chronicle .x { all: unset; cursor: pointer; color: var(--muted); font-size: 16px; padding: 4px 8px; }
      .chronicle .chron-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0 12px; }
      .chronicle .chron-stats > div { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 8px 10px; }
      .chronicle .chron-stats span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
      .chronicle .chron-stats b { font: 600 20px "JetBrains Mono", monospace; }
      .chronicle .chron-stats svg { display: block; width: 100%; height: 26px; margin-top: 4px; }
      .chronicle .chron-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
      .chronicle .chron-tabs button { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px; color: var(--muted); }
      .chronicle .chron-tabs button.active { background: var(--accent); color: #07131b; }
      .chronicle .chron-list { max-height: calc(82vh - 230px); overflow-y: auto; padding-right: 6px; }
      .chronicle .chron-day { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
      .chronicle .chron-entry { font-size: 13px; line-height: 1.5; padding: 3px 0; }
      .chronicle .chron-entry span { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); margin-right: 10px; }
      .chronicle .chron-entry.major { color: #fff; font-weight: 500; }
      .chronicle .chron-entry.major::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); margin-right: 8px; vertical-align: middle; }
      .chronicle .empty { color: var(--muted); font-style: italic; font-size: 13px; }
      @media (max-width: 760px) { .chronicle .chron-stats { grid-template-columns: repeat(2, 1fr); } }

      .loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0b0f16; color: var(--muted); font-size: 14px; letter-spacing: 1px; z-index: 10;
        transition: opacity .4s;
      }
      @media (max-width: 760px) {
        .hints, .stats { display: none; }
        .inspector { left: 16px; right: 16px; width: auto; top: auto; bottom: 16px; max-height: 50vh; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="loading" id="loading">GENERATING CITY…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
